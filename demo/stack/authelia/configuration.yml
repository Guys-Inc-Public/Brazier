# Authelia in front of the fronted Grafana: one user in users.yml, one factor, a session cookie on
# brazier.gicloud.org. Secrets come from the environment (AUTHELIA_* in .env). Lives under /authelia
# on the same hostname as the Grafana it guards, so one custom domain covers both.
theme: dark
log:
  level: info
server:
  address: 'tcp://:9091/authelia'
authentication_backend:
  file:
    path: /config/users.yml
    password:
      algorithm: argon2
access_control:
  default_policy: deny
  rules:
    - domain: fronted.brazier.gicloud.org
      policy: one_factor
session:
  name: authelia_session
  expiration: 1h
  inactivity: 15m
  remember_me: 1M
  cookies:
    - domain: brazier.gicloud.org
      authelia_url: https://fronted.brazier.gicloud.org/authelia
      default_redirection_url: https://fronted.brazier.gicloud.org/
storage:
  local:
    path: /config/db.sqlite3
notifier:
  disable_startup_check: true
  filesystem:
    filename: /config/notification.txt
