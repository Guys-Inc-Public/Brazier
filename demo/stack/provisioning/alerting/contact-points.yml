apiVersion: 1
# The demo notifies the Brazier relay the same way the estate does: a webhook signed with the shared
# secret (BRAZIER_WEBHOOK_SECRET from .env). Resolved messages are on so the phone clears alerts.
contactPoints:
  - orgId: 1
    name: brazier
    receivers:
      - uid: brazier
        type: webhook
        settings:
          url: https://brazier.gicloud.org/grafana
          httpMethod: POST
          hmacConfig:
            secret: $BRAZIER_WEBHOOK_SECRET
            header: X-Grafana-Alerting-Signature
            timestampHeader: X-Grafana-Alerting-Timestamp
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: brazier
    group_by: [alertname, host]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
