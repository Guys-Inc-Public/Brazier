# Brazier — Xcode project spec. `make generate` turns this into Brazier.xcodeproj (gitignored).
name: Brazier
options:
  bundleIdPrefix: org.guysinc
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 7VM43528YK
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "8"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Brazier:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Brazier
    info:
      path: Brazier/Info.plist
      properties:
        CFBundleDisplayName: Brazier
        CFBundleName: Brazier
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # HTTPS only, no proprietary encryption: answers the export compliance question so TestFlight can hand out builds at once.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIAppFonts:
          - "Archivo[wdth,wght].ttf"
          - "MartianMono[wdth,wght].ttf"
        UIBackgroundModes:
          - remote-notification
        CFBundleURLTypes:
          - CFBundleURLName: org.guysinc.brazier
            CFBundleURLSchemes:
              - brazier
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.utilities
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Brazier/Brazier.entitlements
      properties:
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.guysinc.brazier
        PRODUCT_NAME: Brazier
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_STRICT_CONCURRENCY: minimal
        SUPPORTS_MACCATALYST: NO
schemes:
  Brazier:
    build:
      targets:
        Brazier: all
    run:
      config: Debug
    archive:
      config: Release
